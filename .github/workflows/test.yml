name: Windows and Linux validation
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          location: ${{ runner.temp }}/msys64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'msys64\ucrt64\bin')
      - run: python -m pip install -e ".[upload]"
      - run: python -m playwright install --with-deps chromium
      - name: C++17 toolchain diagnostics
        run: python main.py --doctor --diagnostic-report outputs/doctor.json
      - run: python -m unittest discover -s tests -v
      - run: python main.py examples/problem.md --points 20 --seed 42 --stress 100 --output outputs/ci-example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            outputs/doctor.json
            outputs/ci-example/report.md
            outputs/ci-example/testcases.zip
            outputs/ci-example/validation.json
