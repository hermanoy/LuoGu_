[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luogu-data-forge"
version = "0.1.0"
description = "Fail-closed local test data pipeline for Luogu"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
upload = ["playwright>=1.48,<2"]

[project.scripts]
luogu-data = "luogu_data.cli:main"

[tool.setuptools.packages.find]
include = ["luogu_data*"]

[tool.setuptools.package-data]
luogu_data = ["policy.json"]
